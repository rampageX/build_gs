name: Build grav1synth Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Clone latest grav1synth
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/rust-av/grav1synth.git grav1synth
          Set-Location grav1synth
          git rev-parse HEAD
          git log -1 --oneline

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: grav1synth -> target

      - name: Prepare LLVM and vcpkg environment
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) {
            $vcpkg = "C:\vcpkg"
          }

          if (-not (Test-Path "$vcpkg\vcpkg.exe")) {
            throw "vcpkg.exe not found at $vcpkg"
          }

          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $llvmCandidates = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files\LLVM\lib"
          )

          $libclangPath = $null
          foreach ($p in $llvmCandidates) {
            if (Test-Path (Join-Path $p "libclang.dll")) {
              $libclangPath = $p
              break
            }
          }

          if (-not $libclangPath) {
            Write-Host "libclang.dll was not found in the normal runner location."
            Write-Host "Installing LLVM with Chocolatey..."
            choco install llvm -y --no-progress
            $libclangPath = "C:\Program Files\LLVM\bin"
          }

          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            throw "libclang.dll still not found."
          }

          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "VCPKG_ROOT=$vcpkg"
          Write-Host "LIBCLANG_PATH=$libclangPath"

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install ffmpeg:x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg FFmpeg installation failed."
          }

      - name: Build grav1synth Release
        shell: pwsh
        working-directory: grav1synth
        run: |
          rustc --version
          cargo --version

          if (Test-Path "Cargo.lock") {
            cargo build --release --locked
          } else {
            cargo build --release
          }

          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed."
          }

          if (-not (Test-Path "target\release\grav1synth.exe")) {
            throw "grav1synth.exe was not produced."
          }

      - name: Package EXE and runtime DLLs
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "grav1synth-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "grav1synth\target\release\grav1synth.exe" $dist
          Copy-Item "grav1synth\LICENSE" $dist -ErrorAction SilentlyContinue
          Copy-Item "grav1synth\README.md" $dist -ErrorAction SilentlyContinue

          # grav1synth dynamically links against the FFmpeg libraries found
          # through vcpkg. Copy the vcpkg runtime DLL directory alongside it.
          $vcpkgBin = Join-Path $env:VCPKG_ROOT "installed\x64-windows\bin"
          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg runtime bin directory not found: $vcpkgBin"
          }

          Copy-Item "$vcpkgBin\*.dll" $dist -Force

          $commit = (git -C grav1synth rev-parse HEAD).Trim()
          $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss 'UTC'"
          @"
          grav1synth Windows x64 community build
          =======================================
          Source : https://github.com/rust-av/grav1synth
          Commit : $commit
          Built  : $date
          Runner : GitHub Actions windows-2022
          Rust   : $(rustc --version)
          FFmpeg : vcpkg ffmpeg:x64-windows

          This is an unsigned personal build produced from the upstream source.
          Keep grav1synth.exe and the DLL files in the same folder.
          "@ | Set-Content -Path (Join-Path $dist "BUILD_INFO.txt") -Encoding utf8

          Get-FileHash (Join-Path $dist "grav1synth.exe") -Algorithm SHA256 |
            Format-List |
            Out-File (Join-Path $dist "SHA256.txt") -Encoding ascii

      - name: Test packaged grav1synth
        shell: pwsh
        run: |
          Set-Location "grav1synth-windows-x64"
          .\grav1synth.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged grav1synth.exe failed the --help test."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "grav1synth-windows-x64\*" `
            -DestinationPath "grav1synth-windows-x64.zip" `
            -CompressionLevel Optimal `
            -Force

          Get-FileHash "grav1synth-windows-x64.zip" -Algorithm SHA256 |
            Format-List |
            Out-File "grav1synth-windows-x64.zip.sha256.txt" -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: grav1synth-windows-x64
          path: |
            grav1synth-windows-x64.zip
            grav1synth-windows-x64.zip.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
